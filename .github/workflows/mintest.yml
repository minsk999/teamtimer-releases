name: Mintest Build
on:
  push:
    tags:
      - 'mintest-*'
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install + build minimal Electron app
        working-directory: _mintest
        run: |
          npm install
          npx electron-builder --mac --x64 --publish never
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: _mintest/dist/*.dmg
          # ★prerelease 필수 — 없으면 이 진단 태그가 releases/latest 가 된다.
          #   앱의 cmpVer 는 'mintest-3' 을 파싱 못 해 0 으로 보고 hasUpdate=false 를 내므로,
          #   그 순간부터 팀 전원의 업데이트 배너가 오류 표시도 없이 영구히 죽는다.
          prerelease: true
