name: AdPopupBlock (mac)

# 광고창 차단 맥판 빌드. 릴리스를 만들지 않고 결과 zip 은 아티팩트로만 올린다
# (릴리스를 만들면 작업 타이머 업데이트 배너가 고장 난다. 배포본은 docs/ 에 직접 커밋한다.)
on:
  push:
    # ★태그 푸시에는 paths 가 적용되지 않는다 — branches 를 적어 두면 v* 태그(작업 타이머 릴리스)에 같이 돌지 않는다.
    branches: ['**']
    paths:
      - 'adpopupblock/mac/**'
      - '.github/workflows/adpopupblock-mac.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build
        run: bash adpopupblock/mac/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AdPopupBlock-mac
          path: adpopupblock/mac/build/AdPopupBlock-*-mac.zip
          if-no-files-found: error