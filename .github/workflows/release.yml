name: Build & Release

# v1.0.0 같은 버전 태그를 푸시하면 자동 실행됩니다.
# (테스트만 하려면 GitHub의 Actions 탭 → 이 워크플로 → Run workflow 로 수동 실행)
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]   # 웹 UI에서 "Publish release" 해도 빌드 → 그 릴리스에 파일 자동 첨부
  workflow_dispatch: {}

permissions:
  contents: write   # Releases 생성/업로드 권한

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # 클라우드 맥 → 유니버설 dmg + zip
            script: build:mac
          - os: windows-latest    # 클라우드 윈도우 → 설치 exe
            script: build:win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write build secrets
        shell: bash
        run: |
          cat > build-secrets.js << EOF
          module.exports = {
            GMAIL_CLIENT_ID: "${{ secrets.GMAIL_CLIENT_ID }}",
            GMAIL_CLIENT_SECRET: "${{ secrets.GMAIL_CLIENT_SECRET }}",
            HOLIDAY_SERVICE_KEY: "${{ secrets.HOLIDAY_SERVICE_KEY }}",
          };
          EOF

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: ignore

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')   # 태그 푸시일 때만 릴리스 생성
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
