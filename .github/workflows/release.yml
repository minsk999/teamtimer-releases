name: Build & Release

# v1.0.0 같은 버전 태그를 푸시하면 자동 실행됩니다.
# (테스트만 하려면 GitHub의 Actions 탭 → 이 워크플로 → Run workflow 로 수동 실행)
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]   # 웹 UI에서 "Publish release" 해도 빌드 → 그 릴리스에 파일 자동 첨부
  workflow_dispatch: {}

permissions:
  contents: write   # Releases 생성/업로드 권한

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # 클라우드 맥 → 유니버설 dmg + zip
            script: build:mac
          - os: windows-latest    # 클라우드 윈도우 → 설치 exe
            script: build:win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Write build secrets
        shell: bash
        run: |
          cat > build-secrets.js << EOF
          module.exports = {
            GMAIL_CLIENT_ID: "${{ secrets.GMAIL_CLIENT_ID }}",
            GMAIL_CLIENT_SECRET: "${{ secrets.GMAIL_CLIENT_SECRET }}",
            HOLIDAY_SERVICE_KEY: "${{ secrets.HOLIDAY_SERVICE_KEY }}",
          };
          EOF

      - name: Install dependencies
        run: npm install

      - name: Patch mac executable name (ASCII path fix)
        if: matrix.os == 'macos-latest'
        run: node patch-mac-name.js

      - name: Build
        run: npm run ${{ matrix.script }}

      - name: Verify mac signature
        if: matrix.os == 'macos-latest'
        run: |
          for A in dist/mac/TeamTimer.app dist/mac-arm64/TeamTimer.app; do
            [ -d "$A" ] || continue
            echo "── $A ──"
            test -f "$A/Contents/_CodeSignature/CodeResources" \
              && echo "  CodeResources 있음" \
              || { echo "  ❌ CodeResources 없음"; exit 1; }
            codesign --verify --deep --strict --verbose=2 "$A"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: ignore
          # ★보존기간을 안 정하면 기본 90일이다. 아티팩트는 계정 단위 스토리지 쿼터를 먹고,
          #   예전에 이 저장소가 쌓아둔 2GB 때문에 다른 저장소의 맥 빌드가 업로드에서 막힌 적이 있다.
          #   릴리스 자산으로 옮겨지고 나면 아티팩트는 쓸모없으므로 하루만 둔다.
          retention-days: 1

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')   # 태그 푸시일 때만 릴리스 생성
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          # 릴리스 제목을 여기서 정한다 — 예전엔 빌드 후 사람이 API 로 PATCH 해야 했다.
          name: 작업 타이머 ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          # ★검증 전 빌드가 releases/latest 가 되면 안 된다.
          #   앱의 업데이트 배너는 releases/latest 를 보므로, 그 순간 팀 전원에게 알림이 뜬다.
          #   실기 확인 후 `gh release edit <태그> --prerelease=false` 로 승격한다.
          prerelease: true
