name: Mintest Build
on:
  push:
    tags:
      - 'mintest-*'
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install + build minimal Electron app
        working-directory: _mintest
        run: |
          npm install
          npx electron-builder --mac --x64 --publish never
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: _mintest/dist/*.dmg
