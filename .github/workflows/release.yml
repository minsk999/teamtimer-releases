name: Build & Release

# v1.0.0 같은 버전 태그를 푸시하면 자동 실행됩니다.
# (테스트만 하려면 GitHub의 Actions 탭 → 이 워크플로 → Run workflow 로 수동 실행)
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]   # 웹 UI 「Publish release」 — 빌드만 돈다(아래 release 잡은 태그 push 때만이라 파일은 붙지 않는다)
  workflow_dispatch: {}

# 기본은 읽기만. 릴리스를 만드는 Publish Release 잡에만 쓰기 권한을 준다.
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # 클라우드 맥 → 유니버설 dmg + zip
            script: build:mac
          - os: windows-latest    # 클라우드 윈도우 → 설치 exe
            script: build:win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false   # 빌드 스크립트·의존성이 토큰을 못 줍게

      - name: Setup Node 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Write build secrets
        shell: bash
        run: |
          cat > build-secrets.js << EOF
          module.exports = {
            GMAIL_CLIENT_ID: "${{ secrets.GMAIL_CLIENT_ID }}",
            GMAIL_CLIENT_SECRET: "${{ secrets.GMAIL_CLIENT_SECRET }}",
            HOLIDAY_SERVICE_KEY: "${{ secrets.HOLIDAY_SERVICE_KEY }}",
          };
          EOF

      # ★태그와 package.json version 이 어긋나면 자산 이름과 릴리스 태그가 갈라진다.
      #   Windows 는 latest.yml 의 url 이 실제 자산과 안 맞아 업데이트가 조용히 죽고,
      #   맥은 같은 버전을 '새 버전'이라며 계속 내려받는다. 빌드 전에 막는다.
      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG  tag=$TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::package.json version($PKG) 과 태그($TAG) 가 다릅니다"
            exit 1
          fi

      # npm ci = package-lock 그대로 설치(빌드마다 의존성이 달라지지 않게). 액션도 커밋 SHA 로 고정했다.
      - name: Install dependencies
        run: npm ci

      # 시험이 깨진 채로는 팀에 배포하지 않는다(가짜 서버·가짜 시계라 네트워크 없음). 한 번이면 충분해 윈도에서만.
      - name: Test
        if: matrix.os == 'windows-latest'
        run: npm test

      - name: Patch mac executable name (ASCII path fix)
        if: matrix.os == 'macos-latest'
        run: node patch-mac-name.js

      - name: Build
        run: npm run ${{ matrix.script }}

      - name: Verify mac signature
        if: matrix.os == 'macos-latest'
        run: |
          for A in dist/mac/TeamTimer.app dist/mac-arm64/TeamTimer.app; do
            [ -d "$A" ] || continue
            echo "── $A ──"
            test -f "$A/Contents/_CodeSignature/CodeResources" \
              && echo "  CodeResources 있음" \
              || { echo "  ❌ CodeResources 없음"; exit 1; }
            codesign --verify --deep --strict --verbose=2 "$A"
          done
          # ★zip 은 dmg 와 별개 경로다. 전개 후에도 서명이 살아 있어야
          #   앱이 자동 업데이트로 받은 번들을 그대로 쓸 수 있다.
          for Z in dist/TeamTimer-*.zip; do
            [ -f "$Z" ] || continue
            RT=$(mktemp -d)
            ditto -x -k "$Z" "$RT"
            APP=$(find "$RT" -maxdepth 1 -name '*.app' | head -1)
            [ -n "$APP" ] || { echo "❌ $Z 안에 .app 이 없음"; exit 1; }
            echo "── zip 왕복 검증: $Z ──"
            codesign --verify --deep --strict --verbose=2 "$APP"
            rm -rf "$RT"
          done

      # ★파일 이름의 아키텍처와 실제 바이너리가 맞는지 본다.
      #   build.mac.target 에 arch 배열이 있으면 --prepackaged 호출마다 x64·arm64 자산을
      #   둘 다 같은 앱으로 만들어, 마지막 호출이 반대편 이름을 덮어쓴다.
      #   v1.0.12~1.0.28 의 -x64.dmg/zip 안에 arm64 바이너리가 들어 있었다(실측).
      #   사람 눈으로는 파일명만 보고 넘어가므로 반드시 기계가 잡아야 한다.
      - name: Verify mac artifact architectures
        if: matrix.os == 'macos-latest'
        run: |
          set -e
          fail=0
          check() {  # $1=경로(.app)  $2=기대 arch  $3=출처 표시
            GOT=$(lipo -archs "$1/Contents/MacOS/TeamTimer" 2>/dev/null || echo "?")
            if [ "$GOT" = "$2" ]; then
              echo "  OK    $3  →  $GOT"
            else
              echo "  ❌ 불일치 $3  이름=$2  실제=$GOT"; fail=1
            fi
          }
          for A in x64 arm64; do
            EXP=$A; [ "$A" = "x64" ] && EXP=x86_64
            for Z in dist/*-$A.zip; do
              [ -f "$Z" ] || continue
              RT=$(mktemp -d); ditto -x -k "$Z" "$RT"
              APP=$(find "$RT" -maxdepth 1 -name '*.app' | head -1)
              check "$APP" "$EXP" "$(basename "$Z")"; rm -rf "$RT"
            done
            for D in dist/*-$A.dmg; do
              [ -f "$D" ] || continue
              MP=$(mktemp -d)
              hdiutil attach "$D" -nobrowse -readonly -mountpoint "$MP" > /dev/null
              APP=$(find "$MP" -maxdepth 1 -name '*.app' | head -1)
              check "$APP" "$EXP" "$(basename "$D")"
              hdiutil detach "$MP" > /dev/null; rm -rf "$MP"
            done
          done
          [ "$fail" = "0" ] || { echo "::error::자산 이름과 실제 아키텍처가 다릅니다"; exit 1; }

      # ★latest.yml 이 가리키는 설치 파일이 실제로 있는지 — 어긋나면 팀 전원의 자동 업데이트가 조용히 실패한다.
      - name: Verify Windows latest.yml
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          P=$(grep -E '^path:' dist/latest.yml | sed 's/^path: *//')
          echo "latest.yml path=$P"
          [ -n "$P" ] && [ -f "dist/$P" ] || { echo "::error::latest.yml 의 path($P) 와 같은 파일이 dist 에 없습니다"; exit 1; }
          V=$(node -p "require('./package.json').version")
          case "$P" in *"$V"*) ;; *) echo "::error::latest.yml 의 파일 이름에 버전 $V 이 없습니다"; exit 1;; esac

      # ★GitHub 쪽 일시 장애(CreateArtifact 시간 초과)로 한 번 실패하면 아래 단계가 같은 이름으로 다시 올린다.
      - name: Upload build artifacts
        id: upload1
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            # latest-mac.yml 은 일부러 뺀다 — 맥은 Squirrel 을 안 쓰고 릴리스 API 를 직접 본다.
            # 올려 두면 아키텍처 한쪽 정보만 담긴 채 남아 나중에 오해를 부른다.
          if-no-files-found: ignore
          # ★보존기간을 안 정하면 기본 90일이다. 아티팩트는 계정 단위 스토리지 쿼터를 먹고,
          #   예전에 이 저장소가 쌓아둔 2GB 때문에 다른 저장소의 맥 빌드가 업로드에서 막힌 적이 있다.
          #   릴리스 자산으로 옮겨지고 나면 아티팩트는 쓸모없으므로 하루만 둔다.
          retention-days: 1

      # 첫 시도가 아티팩트를 반쯤 만들고 죽었으면 같은 이름이 남아 409 가 나므로 overwrite 로 지우고 다시 올린다.
      - name: Upload build artifacts (retry)
        if: steps.upload1.outcome == 'failure'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: ignore
          retention-days: 1
          overwrite: true

  release:
    name: Publish Release
    needs: build
    # ★release 이벤트에서도 GITHUB_REF 는 refs/tags/* 라 이 조건만으로는 걸러지지 않는다.
    #   그대로 두면 웹 UI 로 승격(Publish)한 릴리스를 이 잡이 다시 prerelease 로 되돌린다.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 릴리스 생성·자산 업로드
    steps:
      # tools/release-notes.js 와 docs 를 읽으려고 받는다(공개 저장소라 가지 fetch 에 토큰이 필요 없다).
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # ★새 버전의 변경 내역은 main 이 아니라 docs-vX.Y.Z 가지의 docs/index.html 에 있다(main 의 docs = 공개 페이지).
      #   가지가 없으면 main 의 docs 로, 거기에도 항목이 없으면 설명서 링크 한 줄로 대신한다.
      - name: Build release notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          DOCS=docs/index.html
          if git fetch --depth=1 origin "refs/heads/docs-${TAG}" 2>/dev/null; then
            git show FETCH_HEAD:docs/index.html > "$RUNNER_TEMP/docs.html" && DOCS="$RUNNER_TEMP/docs.html"
            echo "변경 내역 출처: docs-${TAG} 가지"
          else
            echo "::warning::docs-${TAG} 가지를 못 받았어요 — main 의 docs 로 본문을 만듭니다(가지를 태그보다 먼저 푸시했는지 확인)"
          fi
          if ! node tools/release-notes.js "$TAG" "$DOCS" > "$RUNNER_TEMP/notes.md"; then
            echo "::warning::${TAG} 변경 내역을 설명서에서 못 찾아 본문을 링크 한 줄로 대신합니다 — gh release edit 로 채워 주세요"
            echo "변경 내역은 [설명서](https://minsk999.github.io/teamtimer-releases/)를 참고해 주세요." > "$RUNNER_TEMP/notes.md"
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Download all build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: artifacts/**/*
          # 릴리스 제목을 여기서 정한다 — 예전엔 빌드 후 사람이 API 로 PATCH 해야 했다.
          name: 작업 타이머 ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          fail_on_unmatched_files: false
          # ★검증 전 빌드가 releases/latest 가 되면 안 된다.
          #   앱의 업데이트 배너는 releases/latest 를 보므로, 그 순간 팀 전원에게 알림이 뜬다.
          #   실기 확인 후 `gh release edit <태그> --prerelease=false` 로 승격한다.
          prerelease: true
